[mod-setting-description]
more-enemies-debug-level=Changing this will determine what level of debugging to enable.\nOdrder of precedence: Info > Debug > Warn > Error > None\n\nDefault of 'None'.
more-enemies-do-traceback=Changing this will enable traceback in the logging methods to help track down where the log was called from\n\nDefault of 'False'.

more-enemies-clone-nauvis-units=Range of 0 to 10 inclusive, default of 1.\n\nMultiplier of the spawned units on Nauvis\ni.e. the amount of times a unit is cloned
more-enemies-clone-nauvis-groups=Range of 0 to 10 inclusive, default of 1.\n\nMultiplier of the spawned unit groups on Nauvis\ni.e. the amount of times the unit group is cloned

more-enemies-clone-gleba-units=Range of 0 to 10 inclusive, default of 1.\n\nMultiplier of the spawned units on Gleba\ni.e. the amount of times a unit is cloned
more-enemies-clone-gleba-unit-groups=Range of 0 to 10 inclusive, default of 1.\n\nMultiplier of the spawned unit groups on Gleba\ni.e. the amount of times the unit group is cloned

more-enemies-nauvis-do-evolution-factor=Makes enemies scale with evolution factor\nApply evolution factor [0 - 1] in cloning calculations.
more-enemies-gleba-do-evolution-factor=Makes enemies scale with evolution factor\nApply evolution factor [0 - 1] in cloning calculations.

more-enemies-nauvis-do-attack-group=Enemy unit groups will spawn and attack on their own independently of pollution.
more-enemies-gleba-do-attack-group=Enemy unit groups will spawn and attack on their own independently of pollution.

more-enemies-nauvis-attack-group-peace-time=Amount of time (in minutes) that must pass before proactive attack groups will start spawning.\n\nDefault of 45 minutes
more-enemies-gleba-attack-group-peace-time=Amount of time (in minutes) that must pass before proactive attack groups will start spawning.\n\nDefault of 45 minutes

more-enemies-max-unit-group-size-runtime=Maximum size of the unit groups that form (e.g. retaliation attack from an artillery strike)\nDefault of 200 (Vanilla)\n\nIs overridden by the startup setting.
more-enemies-max-unit-group-size-startup=Maximum size of the unit groups that form (e.g. retaliation attack from an artillery strike)\nDefault of 200 (Vanilla)\n\nIs overridden by the startup setting.

more-enemies-max-gathering-unit-groups=Maximum number of automatically created unit groups gathering for attack at any time.
more-enemies-max-clients-to-accept-any-new-request=Up until this amount, any client will be served by the path finder (no estimate on the path length).
more-enemies-max-clients-to-accept-short-new-request=From maximum clients to accecpt any new request till this one, only those that have a short estimate will be served.
more-enemies-direct-distance-to-consider-short-request=This is the "threshold" to decide what is short and what is not.
more-enemies-short-request-max-steps=If a short request takes more than this many steps, it will be rescheduled as a long request.

more-enemies-do-not-print=Whether or not the given log level messages should be also printed to the screen or not.\ni.e. If enabled, messages will only be logged to factorio-current.log and not displayed in-game.

more-enemies-nth-tick=The number of ticks between updates.
more-enemies-clones-per-tick=The amount of clones to attempt to create per tick cycle. If exceeded, will break until the next cycle.
more-enemies-maximum-number-of-clones=Maximum amount of clones at any given time for a given surface.

more-enemies-maximum-number-of-modded-clones=Maximum number of entities created by other mods which are then cloned by more-enemies

more-enemies-minimum-attack-group-delay=Lower bound (in ticks) by which attack group processing is controlled\n\ni.e. math.random(delay_min, delay_max) / selected_difficulty.value
more-enemies-maximum-attack-group-delay=Upper bound (in ticks) by which attack group processing is controlled\n\ni.e. math.random(delay_min, delay_max) / selected_difficulty.value

more-enemies-nauvis-spawn-attack-group-probability-modifier=This value multiplies the probability an attack group will spawn when a valid enemy and target are found on Nauvis. The spawn probability is determined as follows:\n\nlocal max_probability = 1 - (1 / selected_difficulty.value)\nif (max_probability < 0) then max_probability = 0 end\nmax_probability = max_probability * probability_modifier\nlocal threshold = max_probability * evolution_factor
more-enemies-gleba-spawn-attack-group-probability-modifier=This value multiplies the probability an attack group will spawn when a valid enemy and target are found on Gleba. The spawn probability is determined as follows:\n\nlocal max_probability = 1 - (1 / selected_difficulty.value)\nif (max_probability < 0) then max_probability = 0 end\nmax_probability = max_probability * probability_modifier\nlocal threshold = max_probability * evolution_factor

more-enemies-nauvis-attack-group-require-nearby-spawner=Whether a nearby spawner is required to spawn proactive attack groups. If disabled, attacks groups can spawn off of themselves.
more-enemies-gleba-attack-group-require-nearby-spawner=Whether a nearby spawner is required to spawn proactive attack groups. If disabled, attacks groups can spawn off of themselves.

more-enemies-attack-group-blacklist-names=Comma separated list of the names of entities that should be ignored when looking for a target for attack groups.\n\ne.g. character,small-electric-pole,medium-electric-pole,big-electric-pole,substation,curved-rail-a,curved-rail-b,elevated-curved-rail-a,elevated-curved-rail-b,elevated-half-diagonal-rail,elevated-straight-rail,half-diagonal-rail,rail-ramp,rail-signal,rail-chain-signal,rail-support,straight-rail,train-stop,artillery-wagon,cargo-wagon,fluid-wagon,locomotive,radar,solar-panel,accumulator,arithmetic-combinator,constant-combinator,decider-combinator,selector-combinator,small-lamp,power-switch